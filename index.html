<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>M0 垂直切片 · 打盹花园:除草特工</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #1b2317; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #c { display: block; width: 100%; height: 100%; background: #6FBF5C; }
  #joyBase {
    position: fixed; left: 24px; bottom: 24px;
    width: 128px; height: 128px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.35);
    touch-action: none; z-index: 20;
  }
  #joyKnob {
    position: absolute; left: 44px; top: 44px;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.55); border: 2px solid rgba(255,255,255,0.8);
    pointer-events: none;
  }
  #overlay {
    position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center;
    background: rgba(10,14,8,0.72); z-index: 30; font-family: sans-serif;
  }
  #overlayCard {
    background: #fff6e0; color: #3b4a2e; border: 4px solid #3b4a2e;
    border-radius: 16px; padding: 20px 24px; max-width: 86vw; min-width: 260px;
    text-align: center; box-sizing: border-box;
  }
  #overlayCard h2 { margin: 0 0 8px; font-size: 22px; }
  #overlayCard p { margin: 4px 0; font-size: 14px; line-height: 1.5; }
  #overlayBtn {
    margin-top: 14px; display: inline-block; min-width: 140px; min-height: 44px;
    line-height: 44px; background: #6FBF5C; color: #1b2317; font-size: 16px;
    border-radius: 10px; border: 3px solid #3b4a2e; cursor: pointer;
  }
  #hintText {
    /* 不能放在最顶部:HUD(等级/血条/计时/击杀/FPS调试行)画在 canvas 上占据
       左右两块顶部区域,y 方向最深到约 66px(血条)/72px(FPS 调试行),这里
       用一个安全间距避免与 HUD 文字重叠(已知问题,见 v2/README.md);
       env(safe-area-inset-top) 兼容异形屏/刘海屏顶部安全区(PLAN.md §5)。 */
    position: fixed; left: 0; right: 0;
    top: calc(78px + env(safe-area-inset-top, 0px));
    text-align: center;
    color: rgba(255,255,255,0.8); font: 12px sans-serif; z-index: 15; pointer-events: none;
    transition: opacity 1s ease; opacity: 1;
  }
  #hintText.faded { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="hintText"></div>
<div id="overlay">
  <div id="overlayCard">
    <h2 id="overlayTitle">结算</h2>
    <div id="overlayBody"></div>
    <div id="overlayBtn">重新开始</div>
  </div>
</div>
<script>
'use strict';
/* ====================================================================
 * M0 垂直切片 —— 打盹花园:除草特工
 * 单文件 Canvas2D 实现,规则依据:
 *   docs/v2/PLAN.md, docs/v2/CORE-LOOP-v2.1.md, docs/v2/ART-DIRECTION-25D.md
 * 详见 v2/README.md 的已实现/未实现清单与已知限制。
 * ==================================================================== */

/* ---------- SECTION: boot / URL params / RNG ---------- */
var urlParams = new URLSearchParams(location.search);
var SEED = urlParams.has('seed') ? (parseInt(urlParams.get('seed'), 10) >>> 0) : ((Date.now() ^ 0x9e3779b9) >>> 0);
var AUTO_MODE = urlParams.get('auto') === '1';

// mulberry32 手写 PRNG,固定种子可复现(同 docs/v2/tools/sim-core-loop*.js 的方法论)
function makeRng(seed) {
  var s = seed >>> 0;
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
var rng = makeRng(SEED);
function rngRange(min, max) { return min + rng() * (max - min); }
function rngInt(min, max) { return min + Math.floor(rng() * (max - min + 1)); } // 闭区间 [min,max]

/* __SECTION_BOOT__ */

/* ---------- SECTION: constants ---------- */

// ---- 等距投影(ART-DIRECTION-25D.md §3.1,2:1 菱形瓦片假设)----
var TILE_W = 64, TILE_H = 32; // 菱形瓦片宽高(屏幕像素,未乘 DPR)
var TILE_HALF_W = TILE_W / 2, TILE_HALF_H = TILE_H / 2;

// ---- 性能预算(PLAN.md §2.3 中端档位,M0 单一档位起点,未经真机校准)----
var DPR_CAP = 1.5;
var RENDER_BUDGET_ENEMY = 150; // 同屏敌人精绘上限(按与玩家距离取最近 N 个);超出的仍是剪影绘制,
// 不是不绘制(PLAN.md §2.3 硬性公平性约束:能参与碰撞/伤害结算就不允许完全不可见)。
var MONSTER_POOL_CAP = 900; // 逻辑对象池容量(含 spawnStress 压测余量,不是正常对局的存活上限)
var PARTICLE_POOL_CAP = 700;
var FLOATTEXT_POOL_CAP = 200;

// ---- 逻辑实体存活上限(PLAN.md §2.3:"如果连剪影预算都放不下,优先的降级手段
// 是不生成/暂缓生成,而不是隐身但照打")----
// PLAN.md §2.3 只给了"同屏敌人渲染上限"(RENDER_BUDGET_ENEMY=150)这一个档位数字,
// 没有给"逻辑实体上限"的具体值(只说"可以维护更大的对象池");自然实测(auto 绕圈
// 一局,见 v2/README.md)里逻辑实体数会无界累积到约 500,这个数字本身就是设计
// 假设,按"精绘预算150 + 大潮单次最多70 + 威胁怪存量上限25 + 缓冲"选取,未经校准。
var ALIVE_ENTITY_CAP = 320;
// ---- 闲置(远离玩家且长时间未靠近)回收:避免移速慢的同层/下层怪被玩家甩开后
// 既摸不到也打不到还一直占着逻辑实体名额(CORE-LOOP-v2.1.md 附表"离场逻辑"思路的
// 延伸)。只对 killable/peer 两层生效,威胁怪的存量由 THREAT_STOCK_CAP +
// THREAT_DESPAWN_CHANCE_PER_SECOND 单独管理,这里不重复处理,避免打乱已有的
// 威胁节奏设计。----
// 调度方诊断三:原来 16 格的判定还 OR 了 isWorldPosOnScreen,但 auto 绕圈时
// onScreen 会在同一只怪身上几秒内反复真假跳变(镜头跟着玩家转,怪忽进忽出视野),
// 每次跳回 true 就把 idleTimer 清零,导致世界距离一直卡在 8-16 格(player 5.4
// 的移速远超 killable 1.6/peer 0.3,追不上也掉不下 16 格)的"尾随怪环"永远攒不够
// 5 秒连续游离,既杀不到也回收不掉。改为纯按"是否已经追不上攻击可达范围"这一个
// 距离条件判定(不再看是否在屏内),阈值从 16 降到略大于击退半径上限
// (ATTACK_RADIUS_MAX*1.4≈4.62)的 6:只要连续 5 秒都够不到这个范围就回收,不管
// 这几秒里是不是曾经短暂进过画面。
var IDLE_DESPAWN_DISTANCE = 6; // 超过这个距离(已经追不上攻击可达范围)持续视为"游离在外"
var IDLE_DESPAWN_SECONDS = 5; // 连续游离超过这个时长才回收,避免玩家一掉头就误回收刚出生的怪

// ---- 等级与分段阈值(CORE-LOOP-v2.1.md §3.1,v4b 拍板参数 §9.8)----
var MAX_LEVEL = 200;
function killsNeededForLevel(level) {
  if (level <= 15) return 1;
  if (level <= 30) return 2;
  if (level <= 50) return 4;
  if (level <= 80) return 8;
  if (level <= 120) return 24;
  if (level <= 180) return 60;
  return 150;
}

// ---- 玩家属性随等级增长(CORE-LOOP-v2.1.md §3.3,HP_LEVEL_K 取 v4b 拍板值 0.8)----
var PLAYER_BASE_HP = 100;
var HP_LEVEL_K = 0.8;
function hpForLevel(level) { return PLAYER_BASE_HP * (1 + HP_LEVEL_K * Math.log(1 + level)); }
var PLAYER_BASE_SPEED = 5.4; // 世界单位/秒
var ATTACK_BASE_RADIUS = 2.5; // 武器挥刷命中半径(世界单位),随等级小幅增长,设上限
var ATTACK_RADIUS_MAX = 3.3;
var ATTACK_BASE_INTERVAL = 0.42; // 秒/次,随等级小幅加快,设下限
var ATTACK_INTERVAL_MIN = 0.26;
var HIT_INVULN_SECONDS = 0.6; // 被威胁怪命中后的短暂无敌,避免同帧被多只威胁怪叠加打死

// ---- 怪物刷新三层比例与等级差(CORE-LOOP-v2.1.md §4.1,normal/MILD 档 §9.8)----
var TIER_RATIO_KILLABLE = 0.80;
var TIER_RATIO_PEER = 0.12;
var TIER_RATIO_THREAT = 0.08;
var KILLABLE_LEVEL_GAP_MIN = 1, KILLABLE_LEVEL_GAP_MAX = 6; // L_m = L_p - U(1,6)
var THREAT_LEVEL_GAP_MIN = 1, THREAT_LEVEL_GAP_MAX = 3; // L_m = L_p + U(1,3)

// ---- 威胁怪接触伤害(决策层修正,M0 实测 bug)----
// 此前直接把 sim-core-loop-v4b.js 的 THREAT_HIT_BASE=0.0105 当成
// THREAT_HIT_CHANCE_PER_SECOND 用在"每帧 rng()<rate*dt"判定上:数值上 1 tick=1
// 游戏内秒(v4b TICK_SECONDS=1)换算没错,但语义不对——仿真里这个概率是"威胁怪
// 只要存活在怪物群体里,每秒就有这个概率命中"的*群体环境*抽象,不要求任何"距离"
// 概念;真实游戏把它接到了"必须进入 THREAT_CONTACT_RADIUS 贴身"这个更窄得多的
// 条件上,贴身本身已经是稀有事件,再乘一个为"随时存在即算数"校准的低概率,导致
// 单只贴身怪 8 秒内 ~92% 概率 0 伤害,威胁形同虚设。
// 修正为确定性的"接触即按冷却命中"模型(贴身多久一定会受伤,而不是贴身多久都
// 可能不受伤):贴身且不在无敌帧时,每 THREAT_HIT_INTERVAL_SECONDS 结算一次伤害,
// 由 per-monster 冷却计时,不再用概率。
var THREAT_HIT_INTERVAL_SECONDS = 1.0;
var THREAT_HIT_DAMAGE_RATIO = 0.22; // 每次命中扣当前上限 HP 的比例
var THREAT_CONTACT_RADIUS = 1.1; // 威胁怪进入此半径才可能命中玩家

// ---- 威胁怪存量上限与自然流失(CORE-LOOP-v2.1.md §4.1 新增供给侧约束)----
var THREAT_STOCK_CAP = 25;
var THREAT_DESPAWN_CHANCE_PER_SECOND = 0.02;

// ---- 可杀占比下限保证(CORE-LOOP-v2.1.md §4.1,MIN_KILLABLE_RATIO_FLOOR)----
var MIN_KILLABLE_RATIO_FLOOR = 0.3;

// ---- 预警(telegraph)机制(CORE-LOOP-v2.1.md §2.3)----
var THREAT_TELEGRAPH_SECONDS = 2.0;

// ---- 出生安全距离(CORE-LOOP-v2.1.md §4.3,防碰瓷)----
// 调度方实测(autorun-m0.output.txt t=107~165s)发现这里原来用固定世界单位半径
// (9~19)在等距投影+窄屏(390x844,TILE_HALF_W=32 远大于 TILE_HALF_H=16)下严重
// 失真:同样的世界距离,沿屏幕横向的方向很快冲出可视范围,沿纵向却还在屏幕中央,
// 导致按世界角度均匀撒点时大量 killable/peer 一出生就在屏幕外,既看不见也喂不到
// 玩家,可杀怪供给跟不上消耗。改为按屏幕空间的矩形边界距离取比例(见
// pickSpawnPos/screenEdgeDistAtAngle):系数<1 保证落在真实可视矩形内部,
// >1 则刚好越过边界,无论朝哪个方向撒点,出生点到可视边缘的"视觉距离"都一致。
var SPAWN_EDGE_FACTOR_KILLABLE_MIN = 0.5, SPAWN_EDGE_FACTOR_KILLABLE_MAX = 0.92; // <1:落在屏内,保证可见
var SPAWN_EDGE_FACTOR_PEER_MIN = 0.5, SPAWN_EDGE_FACTOR_PEER_MAX = 0.92;
var SPAWN_EDGE_FACTOR_THREAT_MIN = 1.05, SPAWN_EDGE_FACTOR_THREAT_MAX = 1.35; // >1:刚越过边缘外,配合预警走入画面

// ---- 刷怪节奏(按玩家等级动态,设计假设,待校准)----
var SPAWN_INTERVAL_BASE = 0.55; // 秒
var SPAWN_INTERVAL_MIN = 0.09;
var SPAWN_INTERVAL_LEVEL_FACTOR = 0.0022; // 每级缩短的间隔

// ---- 周期性大潮(清屏时刻,PLAN.md §1.1/§3)----
var WAVE_INTERVAL_SECONDS = 24;
var WAVE_BURST_MIN = 40, WAVE_BURST_MAX = 70;
// 注:CORE-LOOP-v2.1.md §4.1 的 BURST_CLEAR_RATIO 是仿真脚本里"周期性清屏"的抽象
// 参数(清空多少比例的可杀库存),在真实游戏里"清屏"是玩家挥刷自然产生的结果,
// 不是脚本强制清空,因此没有直接对应的实现;真正落地的供给侧约束是下面的
// MIN_KILLABLE_RATIO_FLOOR(可杀占比下限保证)。

// ---- 怪物移动速度(世界单位/秒,占位统一行为,无多怪种差异化,留给 M2)----
var MONSTER_SPEED_KILLABLE = 1.6;
var MONSTER_SPEED_PEER = 0.3;
var MONSTER_SPEED_THREAT = 2.0;

// ---- 单局时长目标(PLAN.md §6,仅用于 HUD 展示/统计,不做强制截断)----
var RUN_TARGET_MIN_SECONDS = 180, RUN_TARGET_MAX_SECONDS = 300;

// ---- 三层可视化色值(ART-DIRECTION-25D.md §4.2)----
var COLOR_KILLABLE = '#7ED957';
var COLOR_PEER = '#BDB76B';
var COLOR_THREAT = '#FF6B5B';
var COLOR_OUTLINE_DEFAULT = '#3B4A2E';
var COLOR_GROUND_A = '#6FBF5C';
var COLOR_GROUND_B = '#66B254';
var COLOR_MONSTER_BODY = '#D7E8A0';
var COLOR_PLAYER_BODY = '#FFD15C';

// ---- 闪光/频率仲裁(PLAN.md §3 红线:任意1秒窗口触发次数有硬上限)----
var SHAKE_MAX_MAGNITUDE = 9; // 像素
var SHAKE_DURATION = 0.18; // 秒

/* __SECTION_CONSTANTS__ */

/* ---------- SECTION: platform & save adapter ---------- */

// 平台抽象层占位(PLAN.md §8 engine/platform.js 思路的最小子集):
// 浏览器用 localStorage,wx/tt 小游戏环境用各自的同步 Storage API。
// 这里只实现"存档读写"这一个最小能力,不是完整平台层(生命周期/广告等留给后续里程碑)。
var Platform = (function () {
  var kind = 'browser';
  if (typeof wx !== 'undefined' && wx && typeof wx.setStorageSync === 'function') kind = 'wx';
  else if (typeof tt !== 'undefined' && tt && typeof tt.setStorageSync === 'function') kind = 'tt';

  function getItem(key) {
    try {
      if (kind === 'wx') return wx.getStorageSync(key) || null;
      if (kind === 'tt') return tt.getStorageSync(key) || null;
      return localStorage.getItem(key);
    } catch (e) { return null; }
  }
  function setItem(key, value) {
    try {
      if (kind === 'wx') { wx.setStorageSync(key, value); return; }
      if (kind === 'tt') { tt.setStorageSync(key, value); return; }
      localStorage.setItem(key, value);
    } catch (e) { /* 存储失败不阻塞游戏,静默忽略(小游戏同步存储已知会抛异常) */ }
  }
  return { kind: kind, getItem: getItem, setItem: setItem };
})();

var SAVE_KEY = 'm0_save';
var SAVE_VERSION = 1;

function defaultSave() {
  return {
    saveVersion: SAVE_VERSION,
    highestLevelEver: 0,
    totalKillsEver: 0,
    totalRunsEver: 0
  };
}

function loadSave() {
  var raw = Platform.getItem(SAVE_KEY);
  if (!raw) return defaultSave();
  var data;
  try { data = JSON.parse(raw); } catch (e) { return defaultSave(); }
  if (!data || typeof data !== 'object' || data.saveVersion !== SAVE_VERSION) {
    // 版本不匹配:M0 阶段没有迁移链,直接回退到默认值(CORE-LOOP-v2.1.md §6.4 的完整迁移留给后续里程碑)
    return defaultSave();
  }
  return {
    saveVersion: SAVE_VERSION,
    highestLevelEver: Math.max(0, data.highestLevelEver | 0),
    totalKillsEver: Math.max(0, data.totalKillsEver | 0),
    totalRunsEver: Math.max(0, data.totalRunsEver | 0)
  };
}

function writeSave(save) {
  // 只在结算页出现时调用一次(CORE-LOOP-v2.1.md §6.2),不做每帧/每次升级存档
  Platform.setItem(SAVE_KEY, JSON.stringify(save));
}

var saveData = loadSave();

/* __SECTION_PLATFORM__ */

/* ---------- SECTION: object pools ---------- */

// 通用对象池:O(1) acquire/release + 预分配,复用 v1 src/03_pool.js 的设计思路
// (PLAN.md §2.4),不每帧 new 对象。
function createPool(cap, factory) {
  var items = new Array(cap);
  var freeList = new Array(cap);
  for (var i = 0; i < cap; i++) {
    items[i] = factory();
    items[i].__active = false;
    items[i].__poolIndex = i;
    freeList[i] = cap - 1 - i;
  }
  var freeTop = cap;
  return {
    items: items,
    cap: cap,
    acquire: function () {
      if (freeTop <= 0) return null; // 池满:调用方决定降级策略(不生成/不丢逻辑错误)
      freeTop--;
      var obj = items[freeList[freeTop]];
      obj.__active = true;
      return obj;
    },
    release: function (obj) {
      if (!obj.__active) return;
      obj.__active = false;
      freeList[freeTop] = obj.__poolIndex;
      freeTop++;
    },
    activeCount: function () { return cap - freeTop; }
  };
}

var nextEntityId = 1;

function makeMonster() {
  return {
    __active: false, __poolIndex: 0,
    id: 0, wx: 0, wy: 0,
    level: 0,
    telegraph: 0, // >0 表示仍在预警期,0 伤害且不参与反杀判定
    kbVx: 0, kbVy: 0, // 击退残余速度(世界单位/秒),指数衰减
    hitCooldown: 0, // 威胁怪接触伤害冷却(秒),>0 表示本只怪暂不能再次命中玩家
    idleTimer: 0, // 连续游离在 IDLE_DESPAWN_DISTANCE 之外的累计秒数,见 updateMonsters
    stressHold: false // 仅 spawnStress 压测钩子会置 true:跳过所有回收/击杀判定,见 spawnStress
  };
}
var monsterPool = createPool(MONSTER_POOL_CAP, makeMonster);

function acquireMonster(wx, wy, level, telegraphSeconds) {
  var m = monsterPool.acquire();
  if (!m) return null;
  m.id = nextEntityId++;
  m.wx = wx; m.wy = wy;
  m.level = level;
  m.telegraph = telegraphSeconds || 0;
  m.kbVx = 0; m.kbVy = 0;
  m.hitCooldown = 0;
  m.idleTimer = 0;
  m.stressHold = false;
  return m;
}

function makeParticle() {
  return { __active: false, __poolIndex: 0, wx: 0, wy: 0, vx: 0, vy: 0, ttl: 0, maxTtl: 0, size: 0, color: '#fff' };
}
var particlePool = createPool(PARTICLE_POOL_CAP, makeParticle);

function spawnParticleBurst(wx, wy, count, color) {
  for (var i = 0; i < count; i++) {
    var p = particlePool.acquire();
    if (!p) return;
    var ang = rng() * Math.PI * 2;
    var spd = rngRange(1.2, 3.2);
    p.wx = wx; p.wy = wy;
    p.vx = Math.cos(ang) * spd; p.vy = Math.sin(ang) * spd;
    p.ttl = p.maxTtl = rngRange(0.35, 0.6);
    p.size = rngRange(2, 4);
    p.color = color;
  }
}

function makeFloatText() {
  return { __active: false, __poolIndex: 0, wx: 0, wy: 0, risePixels: 0, ttl: 0, maxTtl: 0, text: '', color: '#fff', bold: false };
}
var floatTextPool = createPool(FLOATTEXT_POOL_CAP, makeFloatText);

function spawnFloatText(wx, wy, text, color, bold) {
  var f = floatTextPool.acquire();
  if (!f) return;
  f.wx = wx; f.wy = wy;
  f.risePixels = 0;
  f.ttl = f.maxTtl = 1.1;
  f.text = text;
  f.color = color || '#ffffff';
  f.bold = !!bold;
}

/* __SECTION_POOLS__ */

/* ---------- SECTION: isometric transform & camera ---------- */

// world -> screen(局部,未加相机偏移):ART-DIRECTION-25D.md §3.1
// screenX = (wx - wy) * (TILE_W/2); screenY = (wx + wy) * (TILE_H/2)
var isoResult = { x: 0, y: 0 }; // 复用对象,避免热路径分配(PLAN.md §2.6)
function worldToScreenLocal(wx, wy) {
  isoResult.x = (wx - wy) * TILE_HALF_W;
  isoResult.y = (wx + wy) * TILE_HALF_H;
  return isoResult;
}

// screen 方向意图 -> world 方向(反变换,用于摇杆/键盘输入,ART-DIRECTION-25D.md §3.1 GPT A6 裁决)
// 正向: sx=(wx-wy)*a, sy=(wx+wy)*b  =>  wx=(sx/a+sy/b)/2, wy=(sy/b-sx/a)/2
var worldDirResult = { x: 0, y: 0 };
function screenDirToWorldDir(sx, sy) {
  var a = TILE_HALF_W, b = TILE_HALF_H;
  var wx = (sx / a + sy / b) / 2;
  var wy = (sy / b - sx / a) / 2;
  var len = Math.sqrt(wx * wx + wy * wy);
  if (len > 1e-6) { wx /= len; wy /= len; } else { wx = 0; wy = 0; }
  worldDirResult.x = wx; worldDirResult.y = wy;
  return worldDirResult;
}

// 屏幕像素偏移 -> 世界坐标偏移(和 screenDirToWorldDir 同一套反变换,但不归一化,
// 用于按"屏幕空间的具体一点"反推世界坐标,见 pickSpawnPos/spawnStress 的屏幕边缘撒点)
var screenOffsetResult = { dx: 0, dy: 0 };
function screenOffsetToWorldOffset(sx, sy) {
  var a = TILE_HALF_W, b = TILE_HALF_H;
  screenOffsetResult.dx = (sx / a + sy / b) / 2;
  screenOffsetResult.dy = (sy / b - sx / a) / 2;
  return screenOffsetResult;
}

// 相机:直接跟随玩家(世界坐标),渲染时再叠加屏幕中心偏移与震屏偏移
var camera = { wx: 0, wy: 0 };

// 真实屏内判定(修复 shot-m0-stall.png 暴露的问题:IDLE_DESPAWN_DISTANCE 是固定
// 世界单位半径,和实际视口大小脱钩——视口窄于该半径时,怪会先"走出屏幕"很久
// 之后才达到 16 格的世界距离阈值,期间既不被判定 idle、也占着存活上限名额,
// 导致新怪生不出来。这里按相机(=玩家)为原点,用和渲染一致的等距投影算出
// 怪物的屏幕偏移,是否落在画布范围(留 OFFSCREEN_CULL_MARGIN 余量防止贴边
// 抖动)才是判定"玩家看不看得到这只怪"的准绳。cssWidth/cssHeight 在
// resizeCanvas 里赋值,此处按引用读取当前值即可。
var OFFSCREEN_CULL_MARGIN = 80; // 屏幕像素:怪物图标/等级徽章的绘制半径留量
function isWorldPosOnScreen(wx, wy) {
  var dx = wx - camera.wx, dy = wy - camera.wy;
  var sx = (dx - dy) * TILE_HALF_W;
  var sy = (dx + dy) * TILE_HALF_H;
  return Math.abs(sx) <= cssWidth / 2 + OFFSCREEN_CULL_MARGIN &&
    Math.abs(sy) <= cssHeight / 2 + OFFSCREEN_CULL_MARGIN;
}

// 震屏(PLAN.md §3:取最大值叠加,避免同帧多次震屏线性叠加到眩晕级别)
var shake = { magnitude: 0, timeLeft: 0 };
function applyShake(mag) {
  mag = Math.min(mag, SHAKE_MAX_MAGNITUDE);
  if (mag > shake.magnitude) shake.magnitude = mag;
  if (SHAKE_DURATION > shake.timeLeft) shake.timeLeft = SHAKE_DURATION;
}
var shakeOffset = { x: 0, y: 0 };
function updateShake(dt) {
  if (shake.timeLeft > 0) {
    shake.timeLeft -= dt;
    var t = Math.max(0, shake.timeLeft / SHAKE_DURATION);
    var mag = shake.magnitude * t;
    shakeOffset.x = (rng() - 0.5) * 2 * mag;
    shakeOffset.y = (rng() - 0.5) * 2 * mag;
    if (shake.timeLeft <= 0) { shake.timeLeft = 0; shake.magnitude = 0; shakeOffset.x = 0; shakeOffset.y = 0; }
  } else {
    shakeOffset.x = 0; shakeOffset.y = 0;
  }
}

/* __SECTION_ISO__ */

/* ---------- SECTION: game state ---------- */

var PHASE_RUNNING = 'RUNNING';
var PHASE_DEATH = 'ENDED_DEATH';
var PHASE_WIN = 'ENDED_WIN';

var player = {
  wx: 0, wy: 0,
  level: 1,
  hp: 0, maxHp: 0,
  killCounter: 0, // 当前等级区间内已累计的"合法击杀"数
  invulnTimer: 0, // 被威胁怪命中后的短暂无敌
  attackTimer: 0, // 倒计时到 0 触发下一次挥刷
  facing: 1 // 1 = 面朝屏幕右下(东南),-1 = 水平镜像(朝西南),仅用于占位几何渲染
};

var run = {
  phase: PHASE_RUNNING,
  elapsedSeconds: 0,
  killCount: 0,
  waveTimer: WAVE_INTERVAL_SECONDS,
  spawnTimer: 0,
  deathCause: '' // 结算页文案用
};

function resetRun(newSeed) {
  if (typeof newSeed === 'number') { rng = makeRng(newSeed); }
  // 回收所有怪物/粒子/飘字(逐个 release,不整体重建池,避免分配)
  for (var i = 0; i < monsterPool.cap; i++) {
    var m = monsterPool.items[i];
    if (m.__active) monsterPool.release(m);
  }
  for (var j = 0; j < particlePool.cap; j++) {
    var p = particlePool.items[j];
    if (p.__active) particlePool.release(p);
  }
  for (var k = 0; k < floatTextPool.cap; k++) {
    var f = floatTextPool.items[k];
    if (f.__active) floatTextPool.release(f);
  }
  player.wx = 0; player.wy = 0;
  player.level = 1;
  player.maxHp = hpForLevel(1);
  player.hp = player.maxHp;
  player.killCounter = 0;
  player.invulnTimer = 0;
  player.attackTimer = 0;
  player.facing = 1;
  camera.wx = 0; camera.wy = 0;
  shake.magnitude = 0; shake.timeLeft = 0;
  run.phase = PHASE_RUNNING;
  run.elapsedSeconds = 0;
  run.killCount = 0;
  run.waveTimer = WAVE_INTERVAL_SECONDS;
  run.spawnTimer = 0;
  run.deathCause = '';
  hideOverlay();
}

/* __SECTION_STATE__ */

/* ---------- SECTION: input (keyboard / joystick / auto) ---------- */

// 键盘(桌面):方向键/WASD,输出"屏幕方向意图",和摇杆走同一套转换函数
var keysDown = Object.create(null);
window.addEventListener('keydown', function (e) {
  keysDown[e.key.toLowerCase()] = true;
}, { passive: true });
window.addEventListener('keyup', function (e) {
  keysDown[e.key.toLowerCase()] = false;
}, { passive: true });

var keyboardVec = { x: 0, y: 0 };
function updateKeyboardVec() {
  var x = 0, y = 0;
  if (keysDown['arrowup'] || keysDown['w']) y -= 1;
  if (keysDown['arrowdown'] || keysDown['s']) y += 1;
  if (keysDown['arrowleft'] || keysDown['a']) x -= 1;
  if (keysDown['arrowright'] || keysDown['d']) x += 1;
  var len = Math.sqrt(x * x + y * y);
  if (len > 1e-6) { x /= len; y /= len; }
  keyboardVec.x = x; keyboardVec.y = y;
}

// 虚拟摇杆(触摸,竖屏):DOM 元素 + Pointer Events,统一处理触摸/鼠标
var joyBaseEl = document.getElementById('joyBase');
var joyKnobEl = document.getElementById('joyKnob');
var joyVec = { x: 0, y: 0 };
var joyState = { active: false, pointerId: null, cx: 0, cy: 0, radius: 48 };

function joyPointerDown(e) {
  var rect = joyBaseEl.getBoundingClientRect();
  joyState.active = true;
  joyState.pointerId = e.pointerId;
  joyState.cx = rect.left + rect.width / 2;
  joyState.cy = rect.top + rect.height / 2;
  joyState.radius = rect.width / 2;
  joyPointerMove(e);
  try { joyBaseEl.setPointerCapture(e.pointerId); } catch (err) { /* 部分平台可能不支持,忽略 */ }
}
function joyPointerMove(e) {
  if (!joyState.active || e.pointerId !== joyState.pointerId) return;
  var dx = e.clientX - joyState.cx;
  var dy = e.clientY - joyState.cy;
  var len = Math.sqrt(dx * dx + dy * dy);
  var r = joyState.radius;
  var clamped = Math.min(len, r);
  var nx = len > 1e-6 ? dx / len : 0;
  var ny = len > 1e-6 ? dy / len : 0;
  joyVec.x = len > 1e-6 ? nx * Math.min(1, len / r) : 0;
  joyVec.y = len > 1e-6 ? ny * Math.min(1, len / r) : 0;
  joyKnobEl.style.left = (44 + nx * clamped) + 'px';
  joyKnobEl.style.top = (44 + ny * clamped) + 'px';
}
function joyPointerUp(e) {
  if (e.pointerId !== joyState.pointerId) return;
  joyState.active = false;
  joyState.pointerId = null;
  joyVec.x = 0; joyVec.y = 0;
  joyKnobEl.style.left = '44px';
  joyKnobEl.style.top = '44px';
}
joyBaseEl.addEventListener('pointerdown', joyPointerDown);
joyBaseEl.addEventListener('pointermove', joyPointerMove);
joyBaseEl.addEventListener('pointerup', joyPointerUp);
joyBaseEl.addEventListener('pointercancel', joyPointerUp);

// 自动走位测试模式(?auto=1):调度方诊断三——原来固定绕圈完全不理会怪物分布,
// 玩家移速(5.4)远超 killable(1.6)/peer(0.3),绕圈甩出的"尾随怪环"既追不上也
// 杀不到,auto 测试本身也不像真人会主动走向怪群,压测意义有限。改为"追击最近
// 可杀怪 + 躲避靠近的威胁怪"(见 computeAutoSteerDir),开局极短暂还没刷出可杀怪
// 的空窗期才退回原来的绕圈兜底,保证任何时刻都有确定的移动方向。
var AUTO_ANGULAR_SPEED = 0.6; // 弧度/秒(绕圈兜底仍保留这个常量)
var AUTO_THREAT_AVOID_RADIUS = 6; // 世界单位:威胁怪进入这个范围才触发主动躲避
var AUTO_THREAT_AVOID_WEIGHT = 1.6; // 避险向量权重>1,优先躲威胁而不是以死相撞去追杀
var autoSteerScratch = { x: 0, y: 0 }; // 复用对象,避免热路径分配(PLAN.md §2.6)
function computeAutoSteerDir() {
  var bestDistSq = Infinity, tx = 0, ty = 0, foundKillable = false;
  var avoidX = 0, avoidY = 0;
  for (var i = 0; i < monsterPool.cap; i++) {
    var m = monsterPool.items[i];
    if (!m.__active) continue;
    var dx = m.wx - player.wx, dy = m.wy - player.wy;
    var distSq = dx * dx + dy * dy;
    var tier = tierOf(m.level);
    if (tier === 'killable') {
      if (distSq < bestDistSq) { bestDistSq = distSq; tx = dx; ty = dy; foundKillable = true; }
    } else if (tier === 'threat' && distSq < AUTO_THREAT_AVOID_RADIUS * AUTO_THREAT_AVOID_RADIUS) {
      var dist = Math.sqrt(distSq) || 1;
      avoidX -= dx / dist; avoidY -= dy / dist; // 单位向量反向,指向远离该威胁怪
    }
  }
  var dirX, dirY;
  if (foundKillable) {
    var len = Math.sqrt(bestDistSq) || 1;
    dirX = tx / len; dirY = ty / len;
  } else {
    var ang = run.elapsedSeconds * AUTO_ANGULAR_SPEED;
    dirX = Math.cos(ang); dirY = Math.sin(ang);
  }
  dirX += avoidX * AUTO_THREAT_AVOID_WEIGHT;
  dirY += avoidY * AUTO_THREAT_AVOID_WEIGHT;
  var outLen = Math.sqrt(dirX * dirX + dirY * dirY);
  if (outLen > 1e-6) { dirX /= outLen; dirY /= outLen; }
  else { var ang2 = run.elapsedSeconds * AUTO_ANGULAR_SPEED; dirX = Math.cos(ang2); dirY = Math.sin(ang2); }
  autoSteerScratch.x = dirX; autoSteerScratch.y = dirY;
  return autoSteerScratch;
}

// 最终移动方向(世界坐标系,单位向量):键盘与摇杆意图相加后统一经过
// screenDirToWorldDir 转换(ART-DIRECTION-25D.md §3.1 GPT A6 裁决要求的换算),
// auto 模式的追击/躲避方向直接在世界空间给出,不经过该换算。
var movementWorldDir = { x: 0, y: 0 };
var movementMagnitude = 0; // 0..1,支持摇杆半推的渐进速度
function updateMovementWorldDir() {
  if (AUTO_MODE) {
    var steer = computeAutoSteerDir();
    movementWorldDir.x = steer.x;
    movementWorldDir.y = steer.y;
    movementMagnitude = 1;
    return;
  }
  updateKeyboardVec();
  var sx = keyboardVec.x + joyVec.x;
  var sy = keyboardVec.y + joyVec.y;
  var slen = Math.sqrt(sx * sx + sy * sy);
  movementMagnitude = Math.min(1, slen);
  if (slen < 1e-6) { movementWorldDir.x = 0; movementWorldDir.y = 0; return; }
  var ux = sx / slen, uy = sy / slen; // 方向单位向量(屏幕空间),独立于幅度
  var wd = screenDirToWorldDir(ux, uy);
  movementWorldDir.x = wd.x; movementWorldDir.y = wd.y;
}

/* __SECTION_INPUT__ */

/* ---------- SECTION: spawning ---------- */

// 三层状态由"怪物固定出生等级 vs 玩家当前等级"实时比较得出,不在怪物身上存状态
// (CORE-LOOP-v2.1.md §4.2/裁决G3:追平/反超是规则自然涌现,不是独立触发器)。
function tierOf(monsterLevel) {
  if (monsterLevel < player.level) return 'killable';
  if (monsterLevel === player.level) return 'peer';
  return 'threat';
}

function countTiers() {
  var killable = 0, peer = 0, threat = 0, total = 0;
  for (var i = 0; i < monsterPool.cap; i++) {
    var m = monsterPool.items[i];
    if (!m.__active) continue;
    total++;
    var t = tierOf(m.level);
    if (t === 'killable') killable++; else if (t === 'peer') peer++; else threat++;
  }
  return { killable: killable, peer: peer, threat: threat, total: total };
}

// 屏幕矩形边界沿给定方向的距离(屏幕像素):标准的"从中心沿射线到矩形边"公式,
// marginPx 可以把矩形边界向外(或向内)扩缩,见 pickSpawnPos 的用法。
function screenEdgeDistAtAngle(cosPhi, sinPhi, marginPx) {
  var hw = cssWidth / 2 + marginPx, hh = cssHeight / 2 + marginPx;
  var tx = Math.abs(cosPhi) > 1e-6 ? hw / Math.abs(cosPhi) : Infinity;
  var ty = Math.abs(sinPhi) > 1e-6 ? hh / Math.abs(sinPhi) : Infinity;
  return Math.min(tx, ty);
}

var spawnPosScratch = { wx: 0, wy: 0 };
// 按"屏幕边缘距离的比例"撒点(而不是固定世界单位半径,见 SPAWN_EDGE_FACTOR_*
// 处的注释):随机取一个屏幕方向,找到该方向上矩形边界的像素距离,再乘
// edgeFactor(<1 落在屏内,>1 刚越过边界),最后反变换回世界坐标。这样无论
// 屏幕长宽比或等距投影的横纵拉伸比是多少,"距可视边缘的远近"都是一致的。
function pickSpawnPos(edgeFactorMin, edgeFactorMax) {
  var phi = rng() * Math.PI * 2;
  var cosPhi = Math.cos(phi), sinPhi = Math.sin(phi);
  var edgeDist = screenEdgeDistAtAngle(cosPhi, sinPhi, 0);
  var r = edgeDist * rngRange(edgeFactorMin, edgeFactorMax);
  var off = screenOffsetToWorldOffset(cosPhi * r, sinPhi * r);
  spawnPosScratch.wx = player.wx + off.dx;
  spawnPosScratch.wy = player.wy + off.dy;
  return spawnPosScratch;
}

// 压测专用:直接在当前可视矩形内部(留 10% 内缩边距)均匀撒点,保证
// spawnStress(n) 测的是"n 个怪同屏绘制"的真实负载,而不是撒在屏外又被回收
// (见 spawnStress 处注释)。
function pickOnScreenPos() {
  var sx = rngRange(-1, 1) * cssWidth * 0.45;
  var sy = rngRange(-1, 1) * cssHeight * 0.45;
  var off = screenOffsetToWorldOffset(sx, sy);
  spawnPosScratch.wx = player.wx + off.dx;
  spawnPosScratch.wy = player.wy + off.dy;
  return spawnPosScratch;
}

// 三层各自的出生等级规则(CORE-LOOP-v2.1.md §4.1/§裁决G3),spawnOneOfTier 和
// spawnStress(压测,保证生成等级分布和正常对局一致)共用。
function levelForTier(tier) {
  if (tier === 'killable') return Math.max(0, player.level - rngInt(KILLABLE_LEVEL_GAP_MIN, KILLABLE_LEVEL_GAP_MAX));
  if (tier === 'peer') return player.level;
  return player.level + rngInt(THREAT_LEVEL_GAP_MIN, THREAT_LEVEL_GAP_MAX); // 出生后等级固定不变(裁决G3)
}

// 出生安全距离 + 预警(CORE-LOOP-v2.1.md §2.3/§4.3,防碰瓷式反杀)
function spawnOneOfTier(tier) {
  var pos, telegraph;
  if (tier === 'killable') {
    pos = pickSpawnPos(SPAWN_EDGE_FACTOR_KILLABLE_MIN, SPAWN_EDGE_FACTOR_KILLABLE_MAX);
    telegraph = 0;
  } else if (tier === 'peer') {
    pos = pickSpawnPos(SPAWN_EDGE_FACTOR_PEER_MIN, SPAWN_EDGE_FACTOR_PEER_MAX);
    telegraph = 0;
  } else {
    pos = pickSpawnPos(SPAWN_EDGE_FACTOR_THREAT_MIN, SPAWN_EDGE_FACTOR_THREAT_MAX);
    telegraph = THREAT_TELEGRAPH_SECONDS;
  }
  return acquireMonster(pos.wx, pos.wy, levelForTier(tier), telegraph);
}

function rollTier(tierStats) {
  var r = rng();
  var tier;
  if (r < TIER_RATIO_KILLABLE) tier = 'killable';
  else if (r < TIER_RATIO_KILLABLE + TIER_RATIO_PEER) tier = 'peer';
  else tier = 'threat';
  // 威胁怪存量上限(CORE-LOOP-v2.1.md §4.1):超过上限的刷新直接降级为可杀怪,
  // 保持刷怪节奏(不是简单作废,避免刷怪频率忽快忽慢)。
  if (tier === 'threat' && tierStats.threat >= THREAT_STOCK_CAP) tier = 'killable';
  return tier;
}

// 上限满时的兜底(修复 shot-m0-stall.png 的卡死):正常情况下闲置回收应该已经
// 腾出名额,但 idle 计时有 IDLE_DESPAWN_SECONDS 的滞后窗口,窗口内上限满足以
// 让 spawnTick 一直空转。这里优先淘汰离玩家最远的非威胁怪(威胁怪的存量仍由
// THREAT_STOCK_CAP + 流失概率管,不在这个兜底的淘汰范围内),保证只要还有
// 一只非威胁怪存在,新怪就总能生出来,不会无限期卡在上限。
function reclaimFarthestNonThreatForSpawn() {
  var farthest = null, farthestDistSq = -1;
  for (var i = 0; i < monsterPool.cap; i++) {
    var m = monsterPool.items[i];
    if (!m.__active) continue;
    if (tierOf(m.level) === 'threat') continue;
    if (m.stressHold) continue; // Claude已复核通过(2026-11-01):压测怪不被腾位回收
    var dx = m.wx - player.wx, dy = m.wy - player.wy;
    var distSq = dx * dx + dy * dy;
    if (distSq > farthestDistSq) { farthestDistSq = distSq; farthest = m; }
  }
  if (!farthest) return false;
  monsterPool.release(farthest);
  return true;
}

function spawnTick() {
  // 存活上限(PLAN.md §2.3):达到上限就暂缓生成,等自然击杀/流失/闲置回收腾出
  // 名额,不是把怪隐身但照样结算。monsterPool.activeCount() 是 O(1)。
  if (monsterPool.activeCount() >= ALIVE_ENTITY_CAP && !reclaimFarthestNonThreatForSpawn()) return;
  var stats = countTiers();
  // 可杀占比下限保证(CORE-LOOP-v2.1.md §4.1 诊断二修正):低于下限立即补充,
  // 不等常规刷怪 tick。
  if (stats.total > 0 && stats.killable / stats.total < MIN_KILLABLE_RATIO_FLOOR) {
    spawnOneOfTier('killable');
    return;
  }
  spawnOneOfTier(rollTier(stats));
}

function triggerWave() {
  var n = rngInt(WAVE_BURST_MIN, WAVE_BURST_MAX);
  for (var i = 0; i < n; i++) {
    // 存活上限兜底,大潮也不例外;上限满时同样先尝试淘汰最远的非威胁怪腾位
    if (monsterPool.activeCount() >= ALIVE_ENTITY_CAP && !reclaimFarthestNonThreatForSpawn()) break;
    spawnOneOfTier('killable');
  }
  applyShake(4); // 大潮涌入的轻微震屏提示,不是清屏大招级别的强冻结
}

function updateSpawning(dt) {
  var interval = Math.max(SPAWN_INTERVAL_MIN, SPAWN_INTERVAL_BASE - player.level * SPAWN_INTERVAL_LEVEL_FACTOR);
  run.spawnTimer -= dt;
  var guard = 0; // 防止极端大 dt(例如切后台恢复)下的死循环
  while (run.spawnTimer <= 0 && guard < 40) {
    run.spawnTimer += interval;
    spawnTick();
    guard++;
  }
  run.waveTimer -= dt;
  if (run.waveTimer <= 0) {
    run.waveTimer = WAVE_INTERVAL_SECONDS;
    triggerWave();
  }
}

// 威胁怪自然流失(CORE-LOOP-v2.1.md §4.1):每秒按概率离场,避免只能靠反转/杀死玩家两种方式离场
function updateThreatDespawn(dt) {
  var chance = THREAT_DESPAWN_CHANCE_PER_SECOND * dt;
  for (var i = 0; i < monsterPool.cap; i++) {
    var m = monsterPool.items[i];
    if (!m.__active) continue;
    if (m.telegraph > 0) continue; // 预警期不流失
    if (m.stressHold) continue; // Claude已复核通过(2026-11-01):压测怪不流失
    if (tierOf(m.level) !== 'threat') continue;
    if (rng() < chance) monsterPool.release(m);
  }
}

// 测试钩子:压测批量生成(window.__m0.spawnStress)
// 调度方实测发现 +300 压测后逻辑实体很快被回收只剩 148(绘制 31),原因是
// spawnOneOfTier 撒点在屏外、且 updateMonsters/updateThreatDespawn 的正常回收
// 逻辑继续生效,帧率采样窗口(waitForTimeout+300帧)里 auto 模式还在移动,
// 测的其实是"边生边回收"的残量,不是真实同屏负载。这里改为直接在可视矩形内
// 撒点(pickOnScreenPos)+ 打上 stressHold 标记,让 updateMonsters/
// updateThreatDespawn/performAttackSwing 都跳过这批怪,保证压测期间数量和
// 屏幕占用稳定,帧率测的才是"n 个怪真实同屏绘制"的负载。
function spawnStress(n) {
  n = Math.max(1, n | 0);
  for (var i = 0; i < n; i++) {
    var tier = rollTier(countTiers());
    var pos = pickOnScreenPos();
    var m = acquireMonster(pos.wx, pos.wy, levelForTier(tier), 0);
    if (m) m.stressHold = true;
  }
}

/* __SECTION_SPAWN__ */

/* ---------- SECTION: update loop ---------- */

function attackRadiusForLevel(level) { return Math.min(ATTACK_RADIUS_MAX, ATTACK_BASE_RADIUS + level * 0.004); }
function attackIntervalForLevel(level) { return Math.max(ATTACK_INTERVAL_MIN, ATTACK_BASE_INTERVAL - level * 0.0008); }

function updatePlayerMovement(dt) {
  updateMovementWorldDir();
  var speed = PLAYER_BASE_SPEED * movementMagnitude;
  if (speed > 0) {
    player.wx += movementWorldDir.x * speed * dt;
    player.wy += movementWorldDir.y * speed * dt;
    if (movementWorldDir.x !== 0) player.facing = movementWorldDir.x >= 0 ? 1 : -1;
  }
  if (player.invulnTimer > 0) player.invulnTimer -= dt;
  camera.wx = player.wx; camera.wy = player.wy;
}

// 批量击杀/升级聚合(PLAN.md §3 + CORE-LOOP-v2.1.md §8.2):同一次挥刷触发的
// 多个击杀/多次升级聚合成一条飘字,不逐个堆叠。
function onKillsBatch(n) {
  run.killCount += n;
  player.killCounter += n;
  var oldLevel = player.level;
  while (player.level < MAX_LEVEL) {
    var needed = killsNeededForLevel(player.level);
    if (player.killCounter < needed) break;
    player.killCounter -= needed;
    var oldMax = player.maxHp;
    player.level++;
    player.maxHp = hpForLevel(player.level);
    player.hp += (player.maxHp - oldMax); // 按新旧上限差值回血(CORE-LOOP-v2.1.md §3.3)
  }
  var gained = player.level - oldLevel;
  var msg;
  if (gained > 1) msg = 'Lv.' + oldLevel + '→Lv.' + player.level + ' (+' + gained + ')  ×' + n;
  else if (gained === 1) msg = 'Lv.' + player.level + '  ×' + n;
  else msg = '×' + n;
  spawnFloatText(player.wx, player.wy - 0.4, msg, gained > 0 ? COLOR_PLAYER_BODY : '#FFF6E0', gained > 0);
  if (player.level >= MAX_LEVEL) triggerWin();
}

function performAttackSwing() {
  var radius = attackRadiusForLevel(player.level);
  var knockRadius = radius * 1.4;
  var killsCount = 0;
  for (var i = 0; i < monsterPool.cap; i++) {
    var m = monsterPool.items[i];
    if (!m.__active) continue;
    var dx = m.wx - player.wx, dy = m.wy - player.wy;
    var distSq = dx * dx + dy * dy;
    if (distSq > knockRadius * knockRadius) continue;
    var dist = Math.sqrt(distSq) || 1;
    if (distSq <= radius * radius && tierOf(m.level) === 'killable' && !m.stressHold) {
      // 只能杀严格低级(CORE-LOOP-v2.1.md §1.3),同层/上层武器无效
      spawnParticleBurst(m.wx, m.wy, 5, COLOR_KILLABLE);
      monsterPool.release(m);
      killsCount++;
    } else {
      // 扫到但杀不掉:轻微击退,制造"扫到了"的打击感,不造成伤害
      m.kbVx += (dx / dist) * 2.4;
      m.kbVy += (dy / dist) * 2.4;
    }
  }
  if (killsCount > 0) {
    onKillsBatch(killsCount);
    applyShake(Math.min(SHAKE_MAX_MAGNITUDE, 2 + killsCount * 0.4));
  }
}

function updatePlayerAttack(dt) {
  player.attackTimer -= dt;
  if (player.attackTimer > 0) return;
  player.attackTimer += attackIntervalForLevel(player.level);
  performAttackSwing();
}

function applyThreatHit(m) {
  var dmg = player.maxHp * THREAT_HIT_DAMAGE_RATIO;
  player.hp -= dmg;
  player.invulnTimer = HIT_INVULN_SECONDS;
  applyShake(7);
  spawnFloatText(player.wx, player.wy - 0.3, '-' + Math.round(dmg), COLOR_THREAT, true);
  var dx = player.wx - m.wx, dy = player.wy - m.wy;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  player.wx += (dx / len) * 0.8;
  player.wy += (dy / len) * 0.8;
  if (player.hp <= 0) {
    player.hp = 0;
    triggerDeath(m.level);
  }
}

// 怪物移动 + 预警倒计时 + 威胁命中判定(单次遍历,CORE-LOOP-v2.1.md §2.3/§4.3)
var DESPAWN_DISTANCE = 40; // 玩家移速远超同层/下层怪漂移速度,需要一个兜底回收距离(延续v1 ENEMY_DESPAWN_DISTANCE思路,避免怪留在身后永远回收不掉)
function updateMonsters(dt) {
  for (var i = 0; i < monsterPool.cap; i++) {
    var m = monsterPool.items[i];
    if (!m.__active) continue;
    // Claude已复核通过(2026-11-01,调度方按 spawnStress 注释的既定裁决补齐):压测怪跳过所有回收
    if (m.stressHold) continue;
    var ddx = m.wx - player.wx, ddy = m.wy - player.wy;
    var distFromPlayerSq = ddx * ddx + ddy * ddy;
    if (distFromPlayerSq > DESPAWN_DISTANCE * DESPAWN_DISTANCE) { monsterPool.release(m); continue; }
    var tier = tierOf(m.level);
    // 闲置回收(见 IDLE_DESPAWN_DISTANCE/SECONDS 处注释):只管 killable/peer,
    // 威胁怪的存量由专门的存量上限+流失概率机制管理,这里不碰。
    // 纯按世界距离累计,不再 OR isWorldPosOnScreen(调度方诊断三:onScreen 在
    // auto 绕圈时会反复真假跳变,跳回 true 就把 idleTimer 清零,导致真正该回收
    // 的"尾随怪环"永远攒不够连续 5 秒)。
    if (tier !== 'threat') {
      if (distFromPlayerSq > IDLE_DESPAWN_DISTANCE * IDLE_DESPAWN_DISTANCE) {
        m.idleTimer += dt;
        if (m.idleTimer >= IDLE_DESPAWN_SECONDS) { monsterPool.release(m); continue; }
      } else {
        m.idleTimer = 0;
      }
    }
    if (m.telegraph > 0) {
      m.telegraph -= dt;
      if (m.telegraph < 0) m.telegraph = 0;
    } else {
      var speed = tier === 'killable' ? MONSTER_SPEED_KILLABLE : (tier === 'peer' ? MONSTER_SPEED_PEER : MONSTER_SPEED_THREAT);
      var dx = player.wx - m.wx, dy = player.wy - m.wy;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 1e-4) {
        m.wx += (dx / dist) * speed * dt;
        m.wy += (dy / dist) * speed * dt;
      }
      if (m.hitCooldown > 0) m.hitCooldown -= dt;
      if (tier === 'threat' && player.invulnTimer <= 0 && m.hitCooldown <= 0 && run.phase === PHASE_RUNNING && dist < THREAT_CONTACT_RADIUS) {
        m.hitCooldown = THREAT_HIT_INTERVAL_SECONDS;
        applyThreatHit(m);
      }
    }
    if (m.kbVx !== 0 || m.kbVy !== 0) {
      m.wx += m.kbVx * dt;
      m.wy += m.kbVy * dt;
      var decay = Math.exp(-6 * dt);
      m.kbVx *= decay; m.kbVy *= decay;
      if (Math.abs(m.kbVx) < 0.01) m.kbVx = 0;
      if (Math.abs(m.kbVy) < 0.01) m.kbVy = 0;
    }
  }
}

function updateParticles(dt) {
  for (var i = 0; i < particlePool.cap; i++) {
    var p = particlePool.items[i];
    if (!p.__active) continue;
    p.ttl -= dt;
    if (p.ttl <= 0) { particlePool.release(p); continue; }
    p.wx += p.vx * dt; p.wy += p.vy * dt;
    p.vx *= 0.9; p.vy *= 0.9;
  }
}

function updateFloatTexts(dt) {
  for (var i = 0; i < floatTextPool.cap; i++) {
    var f = floatTextPool.items[i];
    if (!f.__active) continue;
    f.ttl -= dt;
    if (f.ttl <= 0) { floatTextPool.release(f); continue; }
    f.risePixels += 34 * dt;
  }
}

function finalizeRunStats() {
  saveData.highestLevelEver = Math.max(saveData.highestLevelEver, player.level);
  saveData.totalKillsEver += run.killCount;
  saveData.totalRunsEver += 1;
  writeSave(saveData); // 只在结算页出现时写一次(CORE-LOOP-v2.1.md §6.2)
}

function triggerDeath(killerLevel) {
  if (run.phase !== PHASE_RUNNING) return;
  run.phase = PHASE_DEATH;
  run.deathCause = '被等级 ' + killerLevel + ' 的威胁杂草反杀';
  finalizeRunStats();
  showDeathOverlay();
}

function triggerWin() {
  if (run.phase !== PHASE_RUNNING) return;
  run.phase = PHASE_WIN;
  finalizeRunStats();
  showWinOverlay();
}

function update(dt) {
  if (run.phase !== PHASE_RUNNING) {
    updateShake(dt); updateParticles(dt); updateFloatTexts(dt);
    return;
  }
  run.elapsedSeconds += dt;
  updatePlayerMovement(dt);
  updatePlayerAttack(dt);
  updateMonsters(dt);
  updateThreatDespawn(dt);
  updateSpawning(dt);
  updateParticles(dt);
  updateFloatTexts(dt);
  updateShake(dt);
}

/* __SECTION_UPDATE__ */

/* ---------- SECTION: render loop ---------- */

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var cssWidth = 0, cssHeight = 0, currentDpr = 1;
// threatLogic/threatDrawn/collidableUndrawn 是 PLAN.md §2.3 硬性公平性约束的
// 自检字段(见 renderEntities):collidableUndrawn 应恒为 0,留着是为了给以后
// 任何改动当回归信号,而不是靠人工读 HUD 数字。onScreen 是真正落在当前画布
// 可视范围内的实体数(含玩家),drawnEntities 是真正发出 draw 调用的数量——
// 两者现在都可能小于 logicEntities,这是屏幕裁剪生效后的正常结果,不是 bug
// (shot-m0-stall.png 之前的实现没有这层区分,所有活跃怪无论在不在屏幕内都
// 被无差别计入 drawnEntities,掩盖了"怪早就走出屏幕却一直没被回收"的问题)。
var debugStats = { fps: 0, logicEntities: 0, drawnEntities: 0, onScreen: 0, threatLogic: 0, threatDrawn: 0, collidableUndrawn: 0 };
var animClock = 0;

function resizeCanvas() {
  cssWidth = window.innerWidth;
  cssHeight = window.innerHeight;
  currentDpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
  canvas.width = Math.max(1, Math.round(cssWidth * currentDpr));
  canvas.height = Math.max(1, Math.round(cssHeight * currentDpr));
  canvas.style.width = cssWidth + 'px';
  canvas.style.height = cssHeight + 'px';
  // resize 会重置 2D 上下文状态(PLAN.md §2.2),显式重设变换而不是叠加 scale
  ctx.setTransform(currentDpr, 0, 0, currentDpr, 0, 0);
}

// ---- 地面:单次 pattern 填充(性能实测修正,见 v2/README.md 已知限制)----
// 此前每帧对可见范围内每个菱形瓦片单独 drawImage(390x844/DPR1.5 视口下约
// 1225 次/帧,因为等距反投影的可视范围外接矩形天然比屏幕菱形区域大得多),
// 实测 CPU profile 显示 (program)原生栅格化 81%、drawImage 15% 是中端档位
// 帧时不达标的主因,且和实体数量无关(18 个实体时就已经 p50=33.3ms)。
// 棋盘式配色 ((tx+ty)&1) 在屏幕空间里是一个轴对齐的周期图案,周期正好是
// (TILE_W,0) 和 (0,TILE_H)(可由等距变换矩阵推导:(dx,dy)=(1,-1) 和 (1,1) 两步
// 都保持 tx+ty 奇偶性不变,对应屏幕位移恰好是 (TILE_W,0)/(0,TILE_H))。
// 因此只需要把"以原点瓦片为中心、覆盖 3x3 邻域"预渲染进一张 TILE_W x TILE_H
// 的离屏画布,就能用 ctx.createPattern(...,'repeat') + 一次 fillRect 还原整张
// 无限棋盘地面,把每帧的绘制调用从 ~1225 次降到 1 次。
var groundPattern = null;
function drawDiamondPath(octx, cx, cy, hw, hh) {
  octx.moveTo(cx, cy - hh);
  octx.lineTo(cx + hw, cy);
  octx.lineTo(cx, cy + hh);
  octx.lineTo(cx - hw, cy);
  octx.closePath();
}
function buildGroundPattern() {
  var scale = 2; // 固定超采样倍数(配合 pattern.setTransform 缩回原尺寸),保证瓦片清晰度
  var w = TILE_W * scale, h = TILE_H * scale;
  var off = document.createElement('canvas');
  off.width = w; off.height = h;
  var octx = off.getContext('2d');
  var cx = w / 2, cy = h / 2; // 对应瓦片 (tx=0,ty=0) 的屏幕中心
  for (var dtx = -1; dtx <= 1; dtx++) {
    for (var dty = -1; dty <= 1; dty++) {
      var px = cx + (dtx - dty) * TILE_HALF_W * scale;
      var py = cy + (dtx + dty) * TILE_HALF_H * scale;
      octx.beginPath();
      drawDiamondPath(octx, px, py, TILE_HALF_W * scale, TILE_HALF_H * scale);
      octx.fillStyle = ((dtx + dty) & 1) === 0 ? COLOR_GROUND_A : COLOR_GROUND_B;
      octx.fill();
      octx.lineWidth = 2 * scale;
      octx.strokeStyle = 'rgba(59,74,46,0.22)';
      octx.stroke();
    }
  }
  groundPattern = ctx.createPattern(off, 'repeat');
  if (groundPattern.setTransform) groundPattern.setTransform(new DOMMatrix([1 / scale, 0, 0, 1 / scale, 0, 0]));
}

function renderGround(originX, originY) {
  var tx = originX - TILE_HALF_W, ty = originY - TILE_HALF_H;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.fillStyle = groundPattern;
  // fillRect 的绘制开销由目标 canvas 的实际像素裁剪决定,这里用"覆盖整个视口
  // 平移回原坐标系"的精确矩形(多留 1 格余量防接缝),不是靠放大矩形猜余量。
  ctx.fillRect(-tx - TILE_W, -ty - TILE_H, cssWidth + TILE_W * 2, cssHeight + TILE_H * 2);
  ctx.restore();
}

// ---- Y 排序渲染列表(ART-DIRECTION-25D.md §3.2):锚点=脚点(wx,wy),
// 排序键 depth=wx+wy,同深度按实体 id 兜底保证稳定(不抖动)。----
var renderItemPool = [];
(function initRenderItemPool() {
  for (var i = 0; i < MONSTER_POOL_CAP + 1; i++) {
    renderItemPool.push({ kind: '', ref: null, depth: 0, distSq: 0, id: 0, full: false, onScreen: false, forceFull: false });
  }
})();
var renderList = []; // 复用数组(length=0 截断 + push 引用,不新建对象)

function compareByDistSq(a, b) { return a.distSq - b.distSq; }
function compareByDepth(a, b) { if (a.depth !== b.depth) return a.depth - b.depth; return a.id - b.id; }

function buildRenderList() {
  renderList.length = 0;
  var slot0 = renderItemPool[0];
  slot0.kind = 'player'; slot0.ref = player; slot0.depth = player.wx + player.wy; slot0.distSq = 0; slot0.id = -1; slot0.onScreen = true;
  renderList.push(slot0);
  var used = 1;
  for (var i = 0; i < monsterPool.cap; i++) {
    var m = monsterPool.items[i];
    if (!m.__active) continue;
    var dx = m.wx - player.wx, dy = m.wy - player.wy;
    var slot = renderItemPool[used];
    slot.kind = 'monster'; slot.ref = m; slot.depth = m.wx + m.wy; slot.distSq = dx * dx + dy * dy; slot.id = m.id;
    // 真实屏内判定(见 isWorldPosOnScreen 注释),后面 renderEntities 靠这个
    // 字段决定要不要真的发出 draw 调用,而不是像之前一样对所有活跃怪无差别画。
    slot.onScreen = isWorldPosOnScreen(m.wx, m.wy);
    renderList.push(slot);
    used++;
  }
}

// 精绘/剪影分层:按离玩家的距离取最近 RENDER_BUDGET_ENEMY 个精绘,其余仍参与
// 结算且必须可见,降级为剪影(PLAN.md §2.3 硬性公平性约束)——但"必须可见"
// 指的是必须在屏幕范围内可见,不是不管在不在屏幕内都硬画,所以这里额外算出
// forceFull:威胁怪、以及已经逼近接触判定半径的怪,无论距离排名/是否在屏内
// 判定里落在精绘预算内,都强制精绘且强制绘制(renderEntities 里 onScreen||
// forceFull 才会真正发出 draw 调用)——这两类怪的可读性/命中判定直接关系到
// 玩家能不能及时判断躲避或被打中,不能因为屏内判定的边界误差就漏画。
// 真正不在屏幕内、且不是这两类的怪,交给 renderEntities 跳过绘制,详见下面
// collidableUndrawn 自检字段。
// 注:这里对 renderList 做两次原生 Array.sort(一次按距离分层,一次按深度定稿
// 绘制顺序),在怪物数量很大(压测场景)时的分配/耗时尚未实测校准,
// 详见 v2/README.md 已知限制。
var FORCE_FULL_CONTACT_RADIUS = THREAT_CONTACT_RADIUS * 2; // 留出余量,避免贴脸怪因排序偶然落到精绘预算外
function assignRenderTiers() {
  renderList.sort(compareByDistSq);
  for (var i = 0; i < renderList.length; i++) {
    var it = renderList[i];
    if (it.kind === 'player') { it.full = true; it.forceFull = true; continue; }
    var isThreat = tierOf(it.ref.level) === 'threat';
    var isNearContact = it.distSq <= FORCE_FULL_CONTACT_RADIUS * FORCE_FULL_CONTACT_RADIUS;
    it.forceFull = isThreat || isNearContact;
    it.full = it.forceFull || (i <= RENDER_BUDGET_ENEMY);
  }
  renderList.sort(compareByDepth);
}

function threatScaleFor(m) {
  var gap = m.level - player.level; // 固定在 THREAT_LEVEL_GAP_MIN..MAX(出生时定死)
  var t = Math.max(0, Math.min(1, (gap - 1) / Math.max(1, THREAT_LEVEL_GAP_MAX - 1)));
  return 1.1 + t * (1.4 - 1.1);
}

// ---- 头顶图标/等级数字离屏缓存(性能实测修正):怪物数量一多,每帧对每只
// 怪都做两次 ctx.fillText 的文字排版/栅格化开销会叠加(profile 显示 +150 压测
// 场景 fillText 占比从 0.6% 升到 2.5%),改成"只在第一次用到某个字符串+颜色
// 组合时渲染一次到小离屏画布,之后全部 drawImage 复用"。等级数字范围是
// 1..MAX_LEVEL,图标只有 3 种(tier 固定对应 1 种颜色),缓存条目数量有限。----
var textSpriteCache = {};
function getTextSprite(text, color, font) {
  var key = font + '|' + color + '|' + text;
  var cached = textSpriteCache[key];
  if (cached) return cached;
  var scale = 2; // 固定超采样倍数,保证缩放后仍清晰
  var measure = document.createElement('canvas').getContext('2d');
  measure.font = font;
  var w = Math.max(1, Math.ceil(measure.measureText(text).width) + 4);
  var h = 16; // 固定行高,覆盖本游戏用到的两种小号字号即可
  var off = document.createElement('canvas');
  off.width = w * scale; off.height = h * scale;
  var octx = off.getContext('2d');
  octx.scale(scale, scale);
  octx.font = font;
  octx.fillStyle = color;
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.fillText(text, w / 2, h / 2);
  cached = { canvas: off, w: w, h: h };
  textSpriteCache[key] = cached;
  return cached;
}
function drawTextSprite(text, color, font, cx, cy) {
  var sp = getTextSprite(text, color, font);
  ctx.drawImage(sp.canvas, cx - sp.w / 2, cy - sp.h / 2, sp.w, sp.h);
}

// 等级数字徽章:浅绿怪(COLOR_MONSTER_BODY/COLOR_KILLABLE 都偏浅、偏黄绿)身上
// 纯白数字对比度不够,同级/浅色怪尤其明显(已知问题,见 v2/README.md)。改成
// 深色圆角底板 + 深色描边 + 白色填充,三态(killable/peer/threat)统一一个样式,
// 不靠颜色区分徽章本身,只靠明暗对比保证可读性(色弱友好,不依赖色相判断)。
// 数字范围固定 1..MAX_LEVEL,按文本缓存,条目数量有限。
function getLevelBadgeSprite(text) {
  var key = 'badge|' + text;
  var cached = textSpriteCache[key];
  if (cached) return cached;
  var scale = 2;
  var font = 'bold 11px sans-serif';
  var measure = document.createElement('canvas').getContext('2d');
  measure.font = font;
  var padX = 5;
  var w = Math.max(1, Math.ceil(measure.measureText(text).width) + padX * 2);
  var h = 14;
  var r = h / 2;
  var off = document.createElement('canvas');
  off.width = w * scale; off.height = h * scale;
  var octx = off.getContext('2d');
  octx.scale(scale, scale);
  octx.beginPath();
  octx.moveTo(r, 0);
  octx.lineTo(w - r, 0);
  octx.arc(w - r, r, r, -Math.PI / 2, Math.PI / 2);
  octx.lineTo(r, h);
  octx.arc(r, r, r, Math.PI / 2, Math.PI * 1.5);
  octx.closePath();
  octx.fillStyle = 'rgba(27,35,23,0.8)';
  octx.fill();
  octx.lineWidth = 1;
  octx.strokeStyle = 'rgba(255,255,255,0.4)';
  octx.stroke();
  octx.font = font;
  octx.textAlign = 'center';
  octx.textBaseline = 'middle';
  octx.lineWidth = 2.4;
  octx.strokeStyle = '#1b2317';
  octx.strokeText(text, w / 2, h / 2 + 0.5);
  octx.fillStyle = '#ffffff';
  octx.fillText(text, w / 2, h / 2 + 0.5);
  cached = { canvas: off, w: w, h: h };
  textSpriteCache[key] = cached;
  return cached;
}
function drawLevelBadge(text, cx, cy) {
  var sp = getLevelBadgeSprite(text);
  ctx.drawImage(sp.canvas, cx - sp.w / 2, cy - sp.h / 2, sp.w, sp.h);
}

// Claude已复核通过(2026-11-01):按体型和当前 DPR 缓存几何图形,保留脚点相对画布的偏移。
// 当前体型均为 0.01 的整数倍;边缘留白覆盖描边和抗锯齿。手工核算过锚点换算
// (sp.x/sp.y 对应原来的脚点基准),剪影与非剪影两种缓存的绘制坐标都与改动前的
// 几何对齐。
var monsterSpriteCache = {};
function getMonsterSprite(tier, scale, silhouette) {
  var scaleKey = Math.round(scale * 100);
  var key = (silhouette ? 'silhouette|' : 'full|') + tier + '|' + scaleKey + '|' + currentDpr;
  var cached = monsterSpriteCache[key];
  if (cached) return cached;
  var tierColor = tier === 'killable' ? COLOR_KILLABLE : (tier === 'peer' ? COLOR_PEER : COLOR_THREAT);
  var bodyR = silhouette ? 6 : 15 * scaleKey / 100;
  var lineWidth = tier === 'threat' ? 4.5 : (tier === 'peer' ? 3 : 2.5);
  var halfWidth = Math.ceil(silhouette ? bodyR + 2 : Math.max(bodyR * 1.05, bodyR + lineWidth / 2) + 2);
  var top = Math.ceil(bodyR * 2 + (silhouette ? 2 : lineWidth / 2 + 2));
  var bottom = Math.ceil(silhouette ? 2 : Math.max(bodyR * 0.45, lineWidth / 2) + 2);
  var off = document.createElement('canvas');
  off.width = Math.ceil(halfWidth * 2 * currentDpr);
  off.height = Math.ceil((top + bottom) * currentDpr);
  var octx = off.getContext('2d');
  octx.scale(currentDpr, currentDpr);
  if (silhouette) {
    octx.fillStyle = tierColor;
    octx.beginPath();
    octx.arc(halfWidth, top - bodyR, bodyR, 0, Math.PI * 2);
    octx.fill();
  } else {
    octx.globalAlpha = 0.35;
    octx.fillStyle = '#1b2317';
    octx.beginPath();
    octx.ellipse(halfWidth, top, bodyR * 1.05, bodyR * 0.45, 0, 0, Math.PI * 2);
    octx.fill();
    octx.globalAlpha = 1;
    octx.fillStyle = COLOR_MONSTER_BODY;
    octx.beginPath();
    octx.arc(halfWidth, top - bodyR, bodyR, 0, Math.PI * 2);
    octx.fill();
    octx.lineWidth = lineWidth;
    octx.strokeStyle = tierColor;
    octx.stroke();
  }
  cached = { canvas: off, x: halfWidth, y: top, w: off.width / currentDpr, h: off.height / currentDpr };
  monsterSpriteCache[key] = cached;
  return cached;
}

function drawMonsterFull(m, originX, originY) {
  var tier = tierOf(m.level);
  var scale = tier === 'killable' ? 0.82 : (tier === 'peer' ? 1.0 : threatScaleFor(m));
  var s = worldToScreenLocal(m.wx, m.wy);
  var sx = s.x + originX, sy = s.y + originY;
  var bodyR = 15 * scale;
  var alpha = m.telegraph > 0 ? (0.35 + 0.25 * Math.sin(animClock * 6)) : 1;
  var tierColor = tier === 'killable' ? COLOR_KILLABLE : (tier === 'peer' ? COLOR_PEER : COLOR_THREAT);

  // Claude已复核通过(2026-11-01):阴影、身体和描边合为一次绘制;预警只调整
  // 透明度。阴影在缓存精灵里固定 0.35、绘制时再乘外层 alpha,数学上等于原来的
  // 0.35*alpha,非预警状态(alpha=1)完全等价;预警闪烁期间阴影与身体先在缓存
  // 画布里合成一次、再整体乘 alpha 画到主画布,比原来两者独立各自合成多了一次
  // 中间合成步骤,两者有重叠的像素在闪烁瞬间会有肉眼难辨的细微透明度差异
  // (README 已记录),可接受,不改。
  var sp = getMonsterSprite(tier, scale, false);
  ctx.globalAlpha = alpha;
  ctx.drawImage(sp.canvas, sx - sp.x, sy - sp.y, sp.w, sp.h);

  // 头顶图标 + 等级数字徽章(CORE-LOOP-v2.1.md §2.2,数字徽章不可关闭)
  // 图标/数字都走离屏缓存 + drawImage(见 getTextSprite),不再每帧 fillText。
  var icon = tier === 'killable' ? '↓' : (tier === 'peer' ? '=' : '↑☠');
  // Claude已复核通过(2026-11-01):图标和徽章沿用文字缓存,共享同一个 alpha
  // 并在函数末尾显式复位,和合并前(两次 save/restore 内都用同一个 alpha)行为一致。
  drawTextSprite(icon, tierColor, 'bold 12px sans-serif', sx, sy - bodyR * 2 - 9);
  drawLevelBadge(String(m.level), sx, sy - bodyR * 2 + 3);
  ctx.globalAlpha = 1;
}

function drawMonsterSilhouette(m, originX, originY) {
  var tier = tierOf(m.level);
  var s = worldToScreenLocal(m.wx, m.wy);
  // Claude已复核通过(2026-11-01):剪影也使用 DPR 缓存,锚点换算核对无误,不改
  // 其原有透明度。
  var sp = getMonsterSprite(tier, 1, true);
  ctx.drawImage(sp.canvas, s.x + originX - sp.x, s.y + originY - sp.y, sp.w, sp.h);
}

function drawPlayer(originX, originY) {
  var s = worldToScreenLocal(player.wx, player.wy);
  var sx = s.x + originX, sy = s.y + originY;
  var bodyR = 17;

  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#1b2317';
  ctx.beginPath();
  ctx.ellipse(sx, sy, bodyR * 1.1, bodyR * 0.48, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = COLOR_PLAYER_BODY;
  ctx.beginPath();
  ctx.arc(sx, sy - bodyR, bodyR, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = COLOR_OUTLINE_DEFAULT;
  ctx.stroke();
  // 朝向指示(占位几何,水平镜像朝向)
  ctx.fillStyle = COLOR_OUTLINE_DEFAULT;
  var fx = sx + player.facing * bodyR * 0.9, fy = sy - bodyR;
  ctx.beginPath();
  ctx.moveTo(fx, fy - 5);
  ctx.lineTo(fx + player.facing * 7, fy);
  ctx.lineTo(fx, fy + 5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // 武器挥刷范围的待机/攻击脉冲可视化(PLAN.md §7 0:00"武器已开始自动挥砍待机动画")
  var atkIv = attackIntervalForLevel(player.level);
  var swingProgress = 1 - Math.max(0, Math.min(1, player.attackTimer / atkIv));
  var radius = attackRadiusForLevel(player.level) * TILE_HALF_W;
  ctx.save();
  ctx.globalAlpha = 0.2 + 0.2 * Math.sin(swingProgress * Math.PI);
  ctx.strokeStyle = COLOR_PLAYER_BODY;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(sx, sy - bodyR * 0.3, radius, radius * (TILE_HALF_H / TILE_HALF_W), 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function renderEntities(originX, originY) {
  buildRenderList();
  assignRenderTiers();
  var threatLogicCount = 0, threatDrawnCount = 0, onScreenCount = 0, drawnCount = 0;
  var forceFullCount = 0, forceFullDrawnCount = 0;
  for (var i = 0; i < renderList.length; i++) {
    var it = renderList[i];
    if (it.onScreen) onScreenCount++;
    if (it.forceFull) forceFullCount++;
    if (it.kind === 'player') { drawPlayer(originX, originY); drawnCount++; forceFullDrawnCount++; continue; }
    var isThreat = tierOf(it.ref.level) === 'threat';
    if (isThreat) threatLogicCount++;
    // 真正发出 draw 调用的条件是"在屏幕内" 或 "forceFull"(威胁怪/贴脸怪,
    // 公平性约束要求必须可见,不能因为屏内判定的边界误差漏画),不再像之前
    // 那样对所有活跃怪无差别画——这就是 shot-m0-stall.png 里 drawnEntities
    // 恒等于 logicEntities(即便怪早就走出屏幕)的根因所在。
    if (it.onScreen || it.forceFull) {
      if (it.full) drawMonsterFull(it.ref, originX, originY); else drawMonsterSilhouette(it.ref, originX, originY);
      drawnCount++;
      if (it.forceFull) forceFullDrawnCount++;
      if (isThreat) threatDrawnCount++;
    }
  }
  debugStats.logicEntities = monsterPool.activeCount() + 1;
  debugStats.onScreen = onScreenCount;
  debugStats.drawnEntities = drawnCount;
  debugStats.threatLogic = threatLogicCount;
  debugStats.threatDrawn = threatDrawnCount;
  // collidableUndrawn 的含义调整为:公平性约束要求"必须可见"的怪(forceFull,
  // 威胁怪/贴脸怪)里有几个没被画出来,应恒为 0——不再是"活跃但不在屏内的怪"
  // (那部分现在是设计内的正常裁剪,不是异常,改用 onScreen/drawnEntities 观察)。
  debugStats.collidableUndrawn = Math.max(0, forceFullCount - forceFullDrawnCount);
}

function renderParticles(originX, originY) {
  // Claude已复核通过(2026-11-01):粒子池已有容量上限;每次绘制前都显式设置
  // globalAlpha/fillStyle,不依赖上一次的状态,整批 save/restore 安全。
  ctx.save();
  for (var i = 0; i < particlePool.cap; i++) {
    var p = particlePool.items[i];
    if (!p.__active) continue;
    var s = worldToScreenLocal(p.wx, p.wy);
    ctx.globalAlpha = Math.max(0, p.ttl / p.maxTtl);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(s.x + originX, s.y + originY, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function renderFloatTexts(originX, originY) {
  // Claude已复核通过(2026-11-01):飘字池已有容量上限;每次绘制前都显式设置
  // globalAlpha/fillStyle/font/textAlign,不依赖上一次的状态,整批 save/restore 安全。
  ctx.save();
  for (var i = 0; i < floatTextPool.cap; i++) {
    var f = floatTextPool.items[i];
    if (!f.__active) continue;
    var s = worldToScreenLocal(f.wx, f.wy);
    ctx.globalAlpha = Math.max(0, Math.min(1, f.ttl / f.maxTtl));
    ctx.fillStyle = f.color;
    ctx.font = (f.bold ? 'bold ' : '') + '15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, s.x + originX, s.y + originY - f.risePixels - 20);
  }
  ctx.restore();
}

function renderHud() {
  ctx.save();
  ctx.textAlign = 'left';
  ctx.font = 'bold 18px sans-serif';
  ctx.fillStyle = '#fff6e0';
  ctx.fillText('Lv.' + player.level, 16, 30);
  var needed = killsNeededForLevel(player.level);
  if (needed > 1 && player.level < MAX_LEVEL) {
    ctx.font = '12px sans-serif';
    ctx.fillText('还差 ' + (needed - player.killCounter) + ' 杀', 16, 48);
  }
  var hpBarW = 140, hpBarH = 10, hpBarY = 56;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(16, hpBarY, hpBarW, hpBarH);
  var hpRatio = Math.max(0, player.hp / player.maxHp);
  ctx.fillStyle = hpRatio > 0.3 ? COLOR_KILLABLE : COLOR_THREAT;
  ctx.fillRect(16, hpBarY, hpBarW * hpRatio, hpBarH);
  ctx.strokeStyle = COLOR_OUTLINE_DEFAULT;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(16, hpBarY, hpBarW, hpBarH);

  ctx.textAlign = 'right';
  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#fff6e0';
  var mm = Math.floor(run.elapsedSeconds / 60), ss = Math.floor(run.elapsedSeconds % 60);
  ctx.fillText((mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss, cssWidth - 16, 30);
  ctx.fillText('击杀 ' + run.killCount, cssWidth - 16, 48);
  ctx.font = '11px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('FPS ' + debugStats.fps.toFixed(0) + ' / 逻辑' + debugStats.logicEntities + ' / 绘制' + debugStats.drawnEntities + ' / 屏内' + debugStats.onScreen, cssWidth - 16, 64);
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, cssWidth, cssHeight);
  var camScreen = worldToScreenLocal(camera.wx, camera.wy);
  var originX = cssWidth / 2 - camScreen.x + shakeOffset.x;
  var originY = cssHeight / 2 - camScreen.y + shakeOffset.y;
  renderGround(originX, originY);
  renderEntities(originX, originY);
  renderParticles(originX, originY);
  renderFloatTexts(originX, originY);
  renderHud();
}

/* __SECTION_RENDER__ */

/* ---------- SECTION: result overlay / restart ---------- */

var overlayEl = document.getElementById('overlay');
var overlayTitleEl = document.getElementById('overlayTitle');
var overlayBodyEl = document.getElementById('overlayBody');
var overlayBtnEl = document.getElementById('overlayBtn');

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function hideOverlay() { overlayEl.style.display = 'none'; }

function showOverlayGeneric(title, bodyHtml, btnText, onClick) {
  overlayTitleEl.textContent = title;
  overlayBodyEl.innerHTML = bodyHtml;
  overlayBtnEl.textContent = btnText;
  overlayEl.style.display = 'flex';
  overlayBtnEl.onclick = onClick;
}

// 结算页文案必须讲清楚"重来"的范围(CORE-LOOP-v2.1.md §5.2):
// 局内状态清零,但局外最高记录已保存,不是笼统的"游戏结束"。
function withinRunTarget(seconds) {
  return seconds >= RUN_TARGET_MIN_SECONDS && seconds <= RUN_TARGET_MAX_SECONDS;
}

function showDeathOverlay() {
  var mm = Math.floor(run.elapsedSeconds / 60), ss = Math.floor(run.elapsedSeconds % 60);
  var targetNote = withinRunTarget(run.elapsedSeconds) ? '落在 3-5 分钟目标区间内' : '未落在 3-5 分钟目标区间(设计假设,待校准)';
  var body =
    '<p>' + escapeHtml(run.deathCause) + '</p>' +
    '<p>存活时间:' + mm + ' 分 ' + ss + ' 秒 · ' + targetNote + '</p>' +
    '<p>本局最高 Lv.' + player.level + ' · 总击杀 ' + run.killCount + '</p>' +
    '<p>本局结束,已保存本次最高记录(历史最高 Lv.' + saveData.highestLevelEver + ')</p>' +
    '<p style="font-size:12px;opacity:0.75;">M0 暂未实现广告复活,直接重开新局</p>';
  showOverlayGeneric('本局结束 · 被反杀', body, '重新开始', function () { resetRun(); });
}

function showWinOverlay() {
  var mm = Math.floor(run.elapsedSeconds / 60), ss = Math.floor(run.elapsedSeconds % 60);
  var body =
    '<p>花园杂草清扫完毕,达到封顶 Lv.' + MAX_LEVEL + '!</p>' +
    '<p>耗时:' + mm + ' 分 ' + ss + ' 秒 · 总击杀 ' + run.killCount + '</p>' +
    '<p>已保存本次最高记录(历史最高 Lv.' + saveData.highestLevelEver + ')</p>';
  showOverlayGeneric('通关!', body, '再来一局', function () { resetRun(); });
}

/* __SECTION_OVERLAY__ */

/* ---------- SECTION: main loop / resize / boot kickoff ---------- */

var lastFrameTime = 0;
var fpsFrameCount = 0, fpsAccumTime = 0;

function syncDebugHooks() {
  var st = window.__m0.state;
  st.phase = run.phase;
  st.level = player.level;
  st.hp = Math.round(player.hp);
  st.maxHp = Math.round(player.maxHp);
  st.killCount = run.killCount;
  st.elapsedSeconds = run.elapsedSeconds;
  st.seed = SEED;
  st.auto = AUTO_MODE;
}

function frame(ts) {
  if (!lastFrameTime) lastFrameTime = ts;
  var dt = Math.min(0.05, Math.max(0, (ts - lastFrameTime) / 1000)); // clamp 避免切后台恢复时的巨大 dt
  lastFrameTime = ts;
  animClock += dt;

  update(dt);
  render();

  fpsFrameCount++;
  fpsAccumTime += dt;
  if (fpsAccumTime >= 0.5) {
    debugStats.fps = fpsFrameCount / fpsAccumTime;
    fpsFrameCount = 0; fpsAccumTime = 0;
  }
  syncDebugHooks();
  requestAnimationFrame(frame);
}

// ---- 测试钩子(任务要求的 URL 参数与 window.__m0)----
window.__m0 = {
  state: { phase: run.phase, level: player.level, hp: player.hp, maxHp: player.maxHp, killCount: run.killCount, elapsedSeconds: run.elapsedSeconds, seed: SEED, auto: AUTO_MODE },
  stats: debugStats,
  spawnStress: spawnStress
};

var HINT_FADE_DELAY_SECONDS = 6; // 读完一遍操作说明足够的停留时长,之后淡出让出顶部视野(已知问题修正)
var hintTextEl = document.getElementById('hintText');
hintTextEl.textContent =
  'WASD/方向键 或 左下摇杆移动 · 自动挥刷攻击,只能杀严格低级的怪 · seed=' + SEED + (AUTO_MODE ? ' · auto 追击测试中' : '');
setTimeout(function () { hintTextEl.classList.add('faded'); }, HINT_FADE_DELAY_SECONDS * 1000);

buildGroundPattern();
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
resetRun(SEED);
requestAnimationFrame(frame);

/* __SECTION_MAIN__ */

</script>
